services:
  # =========================================================
  # NESTJS BACKEND API SERVICE
  # =========================================================
  api:
    container_name: api
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DATABASE_USER:?DATABASE_USER is required}:${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}@postgres:5432/${DATABASE_NAME:?DATABASE_NAME is required}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      MAIL_HOST: mailhog
      MAIL_PORT: ${MAIL_PORT:-1025}
      DUFFEL_ACCESS_TOKEN: ${DUFFEL_ACCESS_TOKEN:?DUFFEL_ACCESS_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # =========================================================
  # POSTGRESQL DATABASE SERVICE
  # =========================================================
  postgres:
    container_name: postgres
    image: postgres:15-alpine
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # REDIS CACHE & QUEUE SERVICE
  # =========================================================
  redis:
    container_name: redis
    image: redis:7.4-alpine
    pull_policy: missing
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # MAILHOG LOCAL SMTP & TESTING WEB DASHBOARD
  # =========================================================
  mailhog:
    container_name: mailhog
    image: mailhog/mailhog:v1.0.1
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =========================================================
  # NGINX REVERSE PROXY SERVICE
  # =========================================================
  nginx:
    container_name: nginx
    image: nginx:1.27-alpine
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
